<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocat – Học từ vựng</title>
<style>
:root{
  --bg:#fff8f1;
  --bg-2:#fff2e6;
  --card:#ffffff;
  --card-soft:#fffaf6;
  --ink:#1d2333;
  --mut:#6f7384;
  --pri:#ff7a45;
  --pri-strong:#ff5f3c;
  --pri-soft:#ffe7dc;
  --ok:#1f9d68;
  --bad:#e74f5a;
  --bd:#f2e3d6;
  --shadow:0 18px 45px rgba(27, 29, 47, 0.08);
  --radius:22px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#171922;
    --bg-2:#221d26;
    --card:#1d2330;
    --card-soft:#1d2430;
    --ink:#f4f7ff;
    --mut:#a1a7b8;
    --pri:#ff8d5a;
    --pri-strong:#ff7a45;
    --pri-soft:#3c2a25;
    --bd:#2f3744;
    --shadow:0 18px 45px rgba(0, 0, 0, 0.22);
  }
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(circle at top left, rgba(255,122,69,.12), transparent 30%),
             linear-gradient(180deg, var(--bg-2), var(--bg));
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px); 
}
button,input,textarea,select{font:inherit}
.app{max-width:540px;margin:0 auto;padding:16px 14px 30px}
header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;background:rgba(255,255,255,.55);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.4);padding:12px 14px;border-radius:18px;box-shadow:var(--shadow)
}
.logo{font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--pri)}
.stats{display:flex;gap:8px;align-items:center}
.pill{
  background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:6px 10px;
  font-size:12px;font-weight:800;color:var(--ink);box-shadow:0 6px 18px rgba(31,35,51,.04)
}
.gear{
  border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;
  width:34px;height:34px;cursor:pointer;font-size:15px;transition:.2s ease
}
.gear:hover{transform:translateY(-1px)}
nav{
  display:flex;gap:6px;background:rgba(255,255,255,.54);backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.4);border-radius:18px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow)
}
nav button{
  flex:1;border:0;background:none;color:var(--mut);padding:10px 10px;border-radius:12px;
  font-weight:800;font-size:13px;cursor:pointer;transition:.2s ease
}
nav button.on{
  background:linear-gradient(135deg, var(--pri), var(--pri-strong));color:#fff;box-shadow:0 12px 24px rgba(255,122,69,.22)
}
.goal{font-size:12px;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;font-weight:700}
.bar{height:10px;background:var(--pri-soft);border-radius:999px;overflow:hidden;margin-bottom:16px;border:1px solid rgba(255,122,69,.08)}
.bar i{display:block;height:100%;background:linear-gradient(90deg, var(--pri), var(--pri-strong));transition:width .3s ease}
.word{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.04em;word-break:break-word}
.mean{font-size:24px;font-weight:800;color:var(--pri);line-height:1.15;letter-spacing:-.02em}
.tag{
  display:inline-block;font-size:11px;font-weight:800;color:var(--pri);background:var(--pri-soft);
  border-radius:999px;padding:4px 10px;margin-bottom:12px;border:1px solid rgba(255,122,69,.12)
}
.row{display:flex;gap:10px}
.btn, .primary-btn, .secondary-btn, .ghost-btn{
  border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer;transition:.2s ease
}
.btn.pri, .primary-btn{background:linear-gradient(135deg, var(--pri), var(--pri-strong));color:#fff;box-shadow:0 12px 20px rgba(255,122,69,.18)}
.btn.ghost, .secondary-btn{background:var(--pri-soft);color:var(--pri);border:1px solid rgba(255,122,69,.08)}
.ghost-btn{background:var(--card-soft);color:var(--ink);border:1px solid var(--bd)}
.btn:disabled{opacity:.6;cursor:wait}
.opt{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);color:var(--ink);
  border:2px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:10px;font-size:16px;font-weight:700;cursor:pointer;
  transition:.15s ease;box-shadow:0 8px 15px rgba(31,35,51,.02)
}
.opt:hover{transform:translateY(-1px);border-color:rgba(255,122,69,.35)}
.opt .n{color:var(--mut);font-weight:900;min-width:16px}
.opt.ok{border-color:var(--ok);background:rgba(31,157,104,.09)}
.opt.bad{border-color:var(--bad);background:rgba(231,79,90,.08)}
.q{
  background:linear-gradient(180deg, var(--card), var(--card-soft));border:1px solid var(--bd);
  border-radius:24px;padding:24px 16px 18px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow)
}
.dir{font-size:12px;color:var(--mut);margin-bottom:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
select, input, textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--ink);font-size:15px;margin-bottom:10px;font-family:inherit;transition:border-color .2s ease, box-shadow .2s ease}
select:focus,input:focus,textarea:focus{outline:none;border-color:rgba(255,122,69,.6);box-shadow:0 0 0 4px rgba(255,122,69,.08)}
textarea{min-height:110px;resize:vertical}
.li{
  display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);
  border-radius:16px;padding:12px 14px;margin-bottom:10px;gap:10px;box-shadow:0 8px 18px rgba(31,35,51,.03)
}
.li b{display:block;font-size:16px;margin-bottom:2px}.li small{color:var(--mut);display:block;line-height:1.4}
.lv{font-size:11px;font-weight:800;color:var(--pri);background:var(--pri-soft);border-radius:999px;padding:4px 8px;white-space:nowrap;border:1px solid rgba(255,122,69,.12)}
.x{border:0;background:none;color:var(--mut);font-size:17px;cursor:pointer;margin-left:4px;padding:4px}
.tc{text-align:center;color:var(--mut);padding:26px 16px;line-height:1.6}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;-ms-overflow-style:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s ease}
.chip.on{background:linear-gradient(135deg, var(--pri), var(--pri-strong));border-color:transparent;color:#fff;box-shadow:0 12px 20px rgba(255,122,69,.18)}
.note{font-size:12px;color:var(--mut);margin:-2px 0 10px;line-height:1.5}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:rgba(29,35,51,.96);color:#fff;padding:12px 16px;border-radius:14px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center;z-index:9;box-shadow:0 16px 30px rgba(0,0,0,.2)}
#toast.on{opacity:1}
.lab{font-size:12px;font-weight:800;margin:8px 0 4px;display:block;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.msg{font-size:13px;margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--pri-soft);color:var(--ink);word-break:break-word;border:1px solid rgba(255,122,69,.12)}
.panel{background:linear-gradient(180deg, var(--card), var(--card-soft));border:1px solid var(--bd);border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel--tight{padding:14px}
.field-group{display:flex;flex-direction:column}
.helper-text{font-size:12px;color:var(--mut);line-height:1.5;margin:2px 0 8px}
.status-inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inline-badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);border:1px solid rgba(255,122,69,.12)}
.section-title{font-size:18px;font-weight:900;letter-spacing:-.02em;margin:0 0 12px}
.empty-state{padding:26px 14px;text-align:center;color:var(--mut);background:var(--card-soft);border:1px dashed var(--bd);border-radius:16px}
.action-row{display:flex;gap:10px;margin-bottom:10px}
.action-row > *{flex:1}
.filter-bar{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.quote-banner{font-size:12px;color:var(--mut);margin-top:6px}
@media (max-width:420px){
  .app{padding-left:12px;padding-right:12px}
  .stats{gap:6px}
  .pill{padding:5px 8px;font-size:11px}
  .li{padding:10px 12px}
  .li b{font-size:15px}
  .row{gap:8px}
}
</style>
</head>
<body>
<div class="app">
  <header><div class="logo">🐱 Vocat</div><div class="stats"><span class="pill" id="streak">🔥 0</span><span class="pill" id="known">✅ 0/0</span><button class="gear" onclick="openSettings()" title="Cài đặt AI (nhà cung cấp, API key, model)">⚙</button></div></header>
  <nav><button data-t="quiz">Kiểm tra</button><button data-t="list">Từ vựng</button><button data-t="chat">💬 Chat</button><button data-t="set">⚙ Cài đặt</button></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script type="module">
import { GoogleGenAI } from "https://esm.sh/@google/genai";
window.GoogleGenAI = GoogleGenAI;
</script>
<script>
/* ====== CẤU HÌNH AI (nhập key/model ngay trên web ở tab ⚙ Cài đặt) ====== */
var GEMINI_KEY="";   // để trống: nhập API key ngay trên web ở tab ⚙ Cài đặt
var GEMINI_MODEL="gemini-3.5-flash";   // model mặc định, đổi ngay trên web ở tab ⚙ Cài đặt
var GEMINI_FALLBACK="gemini-3.5-flash";   // model dự phòng khi model chính quá tải (503) hoặc hết quota (429)
var PROVIDERS={
  gemini:{name:"Google Gemini",model:"gemini-3.5-flash",models:["gemini-3.5-flash","gemini-3.8-flash"]},
  openai:{name:"OpenAI (ChatGPT)",base:"https://api.openai.com/v1",model:"gpt-4o-mini",models:["gpt-4o-mini","gpt-4o"]},
  anthropic:{name:"Anthropic (Claude)",model:"claude-haiku-5-5",models:["claude-haiku-5-5","claude-sonnet-5-5"]},
  groq:{name:"Groq",base:"https://api.groq.com/openai/v1",model:"llama-3.3-70b-versatile",models:["llama-3.3-70b-versatile"]},
  openrouter:{name:"OpenRouter",base:"https://openrouter.ai/api/v1",model:"openai/gpt-4o-mini",models:["openai/gpt-4o-mini"]},
  deepseek:{name:"DeepSeek",base:"https://api.deepseek.com/v1",model:"deepseek-chat",models:["deepseek-chat"]},
  custom:{name:"Khác (tương thích OpenAI)",base:"",model:"",models:[]}
};
var GEMINI_BASE="https://generativelanguage.googleapis.com/v1beta";
var API_REV="2026-05-20";
var BATCH=30;
var DEF_TOPICS=["Đồ ăn","Công việc","Giáo dục","Miêu tả","Hành động","Du lịch","Gia đình","Cảm xúc","Công nghệ","Thiên nhiên","Giao tiếp","Sức khỏe","Mua sắm","Nhà cửa","Quần áo","Giao thông","Thời gian","Số lượng","Xã hội","Thể thao","Giải trí","Tài chính","Khác"];
/* ================================================= */

var API="mysql.php",DAY=864e5,GAP=[0,1,2,4,8,16],GOAL=10;
var S={words:[],st:{streak:0,last:"",day:"",n:0},tab:"quiz",q:"",f:"",qf:"",dm:"mix",bulk:false,ses:{ok:0,n:0},setMsg:"",usedModel:"",cfg:{provider:"gemini",keys:{},models:{},bases:{}},chat:{messages:[]}};
var cur=null,dir="w2m",opts=[],ans=null,busy=false;

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(t,ms){var e=document.getElementById("toast");e.textContent=t;e.className="on";clearTimeout(toast._t);toast._t=setTimeout(function(){e.className=""},ms||2600)}
function speak(w){try{var u=new SpeechSynthesisUtterance(w);u.lang="en-US";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function ds(){return new Date().toDateString()}
function byId(id){for(var i=0;i<S.words.length;i++)if(S.words[i].id===id)return S.words[i];return null}
function topics(){var seen={},r=[];S.words.forEach(function(x){var t=(x.topic||"").trim();if(t&&!seen[t.toLowerCase()]){seen[t.toLowerCase()]=1;r.push(t)}});return r.sort()}
function knownTopics(){return DEF_TOPICS.slice()}
function canonicalTopic(value){
  var topic=String(value||"").trim().toLowerCase();
  for(var i=0;i<DEF_TOPICS.length;i++)if(DEF_TOPICS[i].toLowerCase()===topic)return DEF_TOPICS[i];
  return "Khác"}
function normalizeCfg(c){
  c=c||{};var o={provider:c.provider||"gemini",keys:c.keys||{},models:c.models||{},bases:c.bases||{}};
  ["keys","models","bases"].forEach(function(f){if(Array.isArray(o[f]))o[f]={}});
  if(c.key&&!o.keys.gemini)o.keys.gemini=c.key;
  if(c.model&&!o.models.gemini)o.models.gemini=c.model;
  return o}
function prov(){return PROVIDERS[S.cfg.provider]?S.cfg.provider:"gemini"}
function gKey(){var p=prov();return S.cfg.keys[p]||(p==="gemini"?(ls("vocat_gk")||GEMINI_KEY):"")}
function gBase(){var p=prov();return S.cfg.bases[p]||PROVIDERS[p].base||""}
function gModel(){var p=prov();return S.cfg.models[p]||(p==="gemini"&&ls("vocat_gm"))||PROVIDERS[p].model}
function openSettings(){S.tab="set";opts=[];ans=null;render()}
function mask(k){return k?("••••"+k.slice(-4)):"chưa có"}
function setProv(v){
  S.cfg.provider=v;var a=document.getElementById("sk"),b=document.getElementById("sm"),c=document.getElementById("sb");
  if(a)a.value="";if(b)b.value="";if(c)c.value="";S.setMsg="";render()}
async function persistCfg(){
  try{var d=await api("setset",{settings:S.cfg});S.cfg=normalizeCfg(d.settings);ls("vocat_cfg",null);ls("vocat_gk",null);ls("vocat_gm",null);return true}
  catch(er){ls("vocat_cfg",JSON.stringify(S.cfg));S.setMsg="⚠ Không lưu được vào MySQL ("+er.message+"). Đã lưu tạm trên trình duyệt này.";return false}}
async function saveSettings(silent){
  var p=prov(),k=val("sk"),m=val("sm"),b=val("sb"),e=document.getElementById("sk");
  if(k)S.cfg.keys[p]=k;
  if(m)S.cfg.models[p]=m;else delete S.cfg.models[p];
  if(document.getElementById("sb")){if(b)S.cfg.bases[p]=b;else delete S.cfg.bases[p]}
  var ok=await persistCfg();
  if(ok)S.setMsg="✅ Đã lưu vào MySQL. "+PROVIDERS[p].name+" · Key: "+mask(gKey())+" · Model: "+gModel();
  if(e)e.value="";
  if(!silent)render()}
async function clearKey(){
  var p=prov();delete S.cfg.keys[p];
  if(p==="gemini")ls("vocat_gk",null);
  var ok=await persistCfg();if(ok)S.setMsg="Đã xoá key "+PROVIDERS[p].name+" khỏi MySQL.";render()}
async function testGemini(){
  if(busy)return;await saveSettings(true);
  if(!gKey()){S.setMsg="❌ Chưa có API key. Dán key vào ô phía trên.";render();return}
  busy=true;S.setMsg="⏳ Đang thử kết nối "+PROVIDERS[prov()].name+" · "+gModel()+"...";render();
  var p='Trả về DUY NHẤT mảng JSON [{"k":0,"m":"quả táo","topic":"Đồ ăn"}] (giữ nguyên nội dung này).';
  callAI(p,ENRICH_SCHEMA).then(function(r){busy=false;S.setMsg="✅ Kết nối OK! "+PROVIDERS[prov()].name+" · "+(S.usedModel||gModel())+" đã trả lời: "+JSON.stringify(r).slice(0,90);render()})
  .catch(function(e){busy=false;S.setMsg="❌ "+e.message;render()})}

/* ---------- Server (PHP/MySQL) ---------- */
async function apiCall(url,opt){
  opt.headers=Object.assign({},opt.headers,{"X-Token":ls("vocat_tk")||""});
  var r=await fetch(url,opt);
  if(r.status===401){
    var p=prompt("Nhập mật khẩu ứng dụng:");if(p===null)throw new Error("Cần mật khẩu");
    ls("vocat_tk",p);opt.headers["X-Token"]=p;r=await fetch(url,opt)}
  var d;try{d=await r.json()}catch(e){throw new Error("Server trả dữ liệu lỗi (kiểm tra mysql.php)")}
  if(d.error)throw new Error(d.error);return d}
function api(a,body){return apiCall(API+"?a="+a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})}
function load(){
  getChatHistory();
  apiCall(API+"?a=list",{method:"GET"}).then(function(d){
    S.words=d.words||[];if(d.stats)S.st=d.stats;if(d.settings)S.cfg=normalizeCfg(d.settings);else{try{var lc=ls("vocat_cfg");if(lc)S.cfg=normalizeCfg(JSON.parse(lc))}catch(e){}}render();
  }).catch(function(e){toast("Lỗi tải dữ liệu: "+e.message,4000);render()})}

/* ---------- Gemini ---------- */
function textOf(d){
  if(typeof d.output_text==="string"&&d.output_text)return d.output_text;
  var out="";(d.steps||[]).forEach(function(s){if(s.type==="model_output")(s.content||[]).forEach(function(c){if(c.type==="text"&&c.text)out+=c.text})});
  if(!out&&d.candidates&&d.candidates[0]&&d.candidates[0].content)(d.candidates[0].content.parts||[]).forEach(function(p){out+=p.text||""});
  return out}
function parseJson(t){
  t=String(t||"").replace(/```json|```/g,"").trim();var v;
  try{v=JSON.parse(t)}catch(e){var a=t.indexOf("["),b=t.lastIndexOf("]");if(a>=0&&b>a)v=JSON.parse(t.slice(a,b+1));else throw new Error("AI trả sai định dạng")}
  if(!Array.isArray(v)&&v&&typeof v==="object"){for(var k in v)if(Array.isArray(v[k]))return v[k]}
  if(!Array.isArray(v))throw new Error("AI trả sai định dạng");return v}
function parseProviderOutput(text,schema){
  text=String(text||"").trim();
  if(!text)throw new Error("AI không trả kết quả");
  return schema?parseJson(text):text}
async function callGemini1(prompt,schema,model){
  var key=gKey(),err=null,r,t,d;
  if(!key)throw new Error("Chưa có API key. Vào tab ⚙ Cài đặt để nhập key.");
  if(window.GoogleGenAI){ /* SDK chính thức: ai.interactions.create */
    try{
      var ai=new window.GoogleGenAI({apiKey:key});
      var request={model:model,input:prompt,store:false};
      if(schema)request.response_format={type:"text",mime_type:"application/json",schema:schema};
      var it=await ai.interactions.create(request);
      return parseProviderOutput(it.output_text||textOf(it),schema);
    }catch(e0){
      err=e0;var msg=String(e0&&e0.message||e0);
      if(/401|403|429|API key|UNAUTHENTICATED|PERMISSION/i.test(msg))throw new Error("Gemini: "+msg.slice(0,240));
    }
  }
  try{
    var interactionBody={model:model,input:prompt,store:false};
    if(schema)interactionBody.response_format={type:"text",mime_type:"application/json",schema:schema};
    var ibody=JSON.stringify(interactionBody);
    try{
      r=await fetch(GEMINI_BASE+"/interactions",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key,"Api-Revision":API_REV},body:ibody});
    }catch(ne){ /* trình duyệt chặn header Api-Revision (CORS) -> thử lại không có header */
      r=await fetch(GEMINI_BASE+"/interactions",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:ibody});
    }
    if(r.ok){d=await r.json();return parseProviderOutput(textOf(d),schema)}
    t=await r.text();err=new Error("HTTP "+r.status+": "+t.slice(0,220));
    if(r.status===401||r.status===403||r.status===429){err.fatal=true;throw err}
  }catch(e){if(e&&e.fatal)throw e;err=e}
  try{ /* dự phòng: generateContent */
    var generationConfig={temperature:0.2};
    if(schema)generationConfig.responseMimeType="application/json";
    r=await fetch(GEMINI_BASE+"/models/"+encodeURIComponent(model)+":generateContent",{method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({contents:[{role:"user",parts:[{text:prompt}]}],generationConfig:generationConfig})});
    if(!r.ok){t=await r.text();throw new Error("HTTP "+r.status+": "+t.slice(0,220))}
    d=await r.json();return parseProviderOutput(textOf(d),schema)
  }catch(e2){throw new Error((err?err.message+" | ":"")+e2.message)}
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

/* items: [{k,w,m}] -> {k:{m,topic}} ; onBatch(map) gọi sau mỗi lô */
async function enrich(items,onBatch){
  var map={},lastErr=null;
  for(var i=0;i<items.length;i+=BATCH){
    var batch=items.slice(i,i+BATCH);
    try{
      var res=await callAI(enrichPrompt(batch,knownTopics()),ENRICH_SCHEMA),part={};
      res.forEach(function(r){if(r&&r.k!=null){part[r.k]={m:String(r.m||"").trim(),topic:canonicalTopic(r.topic)};map[r.k]=part[r.k]}});
      if(onBatch)await onBatch(part);
      if(items.length>BATCH)toast("AI đang xử lý... "+Math.min(i+BATCH,items.length)+"/"+items.length);
    }catch(e){lastErr=e;break}
  }
  map._err=lastErr;return map}

async function classifyWords(list){
  var items=list.map(function(w){return {k:w.id,w:w.w,m:w.m}}),total=0;
  var map=await enrich(items,async function(part){
    var save={};Object.keys(part).forEach(function(k){var w=byId(parseInt(k,10));if(w&&part[k].topic){w.topic=part[k].topic;save[w.id]=w.topic;total++}});
    if(Object.keys(save).length){await api("settopics",{topics:save});render()}
  });
  if(map._err)throw map._err;
  return total}

    h += '<section class="panel">';
    h += '<div class="status-inline" style="margin-bottom:10px"><span class="inline-badge">AI tutor</span></div>';
    h += '<div class="quote-banner">Mẹo: hỏi theo dạng “Nghĩa và ví dụ của…”, “Phân biệt …”, hoặc “Hãy tạo 5 câu với từ …”</div>';
    h += '<div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;max-height:420px;overflow-y:auto;padding-right:4px;">';
    chatMessages.forEach(function(msg){
      var mine=msg.role==="user";
      h += '<div style="display:flex;justify-content:'+ (mine?"flex-end":"flex-start") +';">';
      h += '<div style="max-width:82%;padding:10px 12px;border-radius:16px;line-height:1.5;font-size:14px;'+(mine?'background:linear-gradient(135deg, var(--pri), var(--pri-strong));color:#fff;':'background:var(--card-soft);color:var(--ink);border:1px solid var(--bd);')+'">'+esc(msg.text).replace(/\n/g,"<br>")+'</div>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div style="margin-top:14px;display:flex;gap:8px;align-items:flex-end;">';
    h += '<textarea id="chat-input" rows="2" placeholder="Ví dụ: Nghĩa và ví dụ của improve ..." onkeydown="if(event.key===\'Enter\' && !event.shiftKey){event.preventDefault();sendChat();}"></textarea>';
    h += '<button class="btn pri" style="width:110px;align-self:stretch;" '+(busy?'disabled':'')+' onclick="sendChat()">Gửi</button>';
    h += '</div>';
    h += '</section>';
    m.innerHTML=h;
    var chatBox=document.getElementById("chat-input"); if(chatBox && !chatBox.dataset.focused){chatBox.focus(); chatBox.dataset.focused="1";}
    return}

  var P=poolWords();
  h += '<section class="panel panel--tight">';
  h += '<div class="status-inline" style="margin-bottom:10px"><span class="inline-badge">Kiểm tra</span></div>';
  h += '<div class="filter-bar"><button class="chip'+(S.dm==="mix"?' on':'')+'" onclick="setDm(\'mix\')">🔀 Trộn</button><button class="chip'+(S.dm==="w2m"?' on':'')+'" onclick="setDm(\'w2m\')">Từ → Nghĩa</button><button class="chip'+(S.dm==="m2w"?' on':'')+'" onclick="setDm(\'m2w\')">Nghĩa → Từ</button></div>';
  if(T.length){
    h += '<div class="filter-bar" style="margin-top:8px"><button class="chip'+(S.qf?'':' on')+'" onclick="setQf(-1)">Mọi chủ đề</button>';
    T.forEach(function(t,i){h+='<button class="chip'+(S.qf===t?' on':'')+'" onclick="setQf('+i+')">'+esc(t)+'</button>'});
    h+='</div>';
  }
  h += '</section>';

  h += '<section class="panel panel--tight">';
  h += '<div class="goal"><span>Hôm nay '+today+'/'+GOAL+' · Đúng '+S.ses.ok+'/'+S.ses.n+'</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
  if(P.length<2){
    h += '<div class="empty-state">Cần ít nhất 2 từ để kiểm tra'+(S.qf?' trong chủ đề này':'')+'.<br>Hãy sang tab <b>Từ vựng</b> để thêm từ mới.</div>';
    h += '</section>';
    m.innerHTML=h;return;
  }
  if(!cur||!byId(cur)||P.indexOf(byId(cur))<0)newQ();
  var x=byId(cur);
  if(!opts.length){
    var base=P.length>=4?P:S.words,o=[cur],g=0,n=Math.min(4,base.length);
    while(o.length<n&&g++<300){var r=base[Math.floor(Math.random()*base.length)].id;if(o.indexOf(r)<0)o.push(r)}
    opts=o.sort(function(){return Math.random()-.5});
  }
  h += '<div class="q">';
  h += '<div class="dir">'+(dir==="w2m"?'Chọn nghĩa đúng':'Chọn từ tiếng Anh đúng')+'</div>';
  if(x.topic)h += '<div class="tag">'+esc(x.topic)+'</div>';
  h += (dir==="w2m"?'<div class="word">'+esc(x.w)+'</div>':'<div class="mean">'+esc(x.m)+'</div>');
  h += '</div>';
  opts.forEach(function(i,idx){
    var c="";if(ans!==null){if(i===cur)c=" ok";else if(i===ans)c=" bad"}
    var wd=byId(i);
    h+='<button class="opt'+c+'" onclick="choose('+i+')"><span class="n">'+(idx+1)+'</span><span>'+esc(dir==="w2m"?wd.m:wd.w)+'</span></button>'});
  if(ans!==null)h+='<div class="action-row" style="margin-top:10px"><button class="btn pri" onclick="nextCard()">Tiếp tục →</button></div>';
  h += '</section>';
  m.innerHTML=h;
}
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){S.tab=b.dataset.t;opts=[];ans=null;render()}});
document.addEventListener("keydown",function(e){
  if(S.tab!=="quiz"||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA")return;
  if(ans===null){var n=parseInt(e.key,10);if(n>=1&&n<=opts.length)choose(opts[n-1])}
  else if(e.key==="Enter"||e.key===" "){e.preventDefault();nextCard()}
});
render();load();
</script>
</body>
</html>
